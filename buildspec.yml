version: 0.2

phases:
  pre_build:
    commands:
      - echo Reading build values from Parameter Store...
      - export AWS_DEFAULT_REGION=$(aws ssm get-parameter --name "/petclinic/AWS_DEFAULT_REGION" --query "Parameter.Value" --output text)
      - export ACCOUNT_ID=$(aws ssm get-parameter --name "/petclinic/ACCOUNT_ID" --query "Parameter.Value" --output text)
      - export IMAGE_REPO_NAME=$(aws ssm get-parameter --name "/petclinic/IMAGE_REPO_NAME" --query "Parameter.Value" --output text)
      - export IMAGE_TAG=$(aws ssm get-parameter --name "/petclinic/IMAGE_TAG" --query "Parameter.Value" --output text)
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo Writing artifacts for CodeDeploy...
      - mkdir -p deploy_artifacts/scripts
      - cp appspec.yml docker-compose.yml deploy_artifacts/
      - cp scripts/*.sh deploy_artifacts/scripts/
      - chmod +x deploy_artifacts/scripts/*.sh

artifacts:
  files:
    - '**/*'
  base-directory: deploy_artifacts
